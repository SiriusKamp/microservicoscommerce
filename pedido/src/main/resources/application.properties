spring.application.name=pedido

server.port=8084

spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.pejlgomaezknijrusttk
spring.datasource.password=SiriusKamphorst

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000

# Conexão com o broker RabbitMQ. Em ambiente local usa localhost/guest,
# mas em Docker/Kubernetes/AWS os valores podem vir por variáveis de ambiente.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Exchange central que recebe as mensagens do fluxo de pedidos.
commerce.rabbitmq.exchange=commerce.pedidos.exchange

# Fila onde o serviço estoque irá consumir pedidos recém-solicitados.
commerce.rabbitmq.queue.pedido-solicitado=commerce.pedido.solicitado.queue

# Fila onde o serviço pedido irá consumir a resposta enviada pelo estoque.
commerce.rabbitmq.queue.estoque-resposta=commerce.estoque.resposta.queue

# Routing key usada para entregar mensagens de pedido solicitado na fila correta.
commerce.rabbitmq.routing-key.pedido-solicitado=pedido.solicitado

# Routing key usada para entregar respostas do estoque na fila correta.
commerce.rabbitmq.routing-key.estoque-resposta=estoque.resposta

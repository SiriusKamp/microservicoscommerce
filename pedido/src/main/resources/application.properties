spring.application.name=pedido

server.port=8084

# Importa um arquivo .env opcional da pasta onde o serviço é executado.
# Em Docker/EC2, os mesmos nomes de variáveis podem ser enviados por --env-file.
spring.config.import=optional:file:.env[.properties]

# Conexão com banco por variáveis de ambiente. Não grave credenciais reais aqui.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000

# Conexão com o broker RabbitMQ. Em ambiente local usa localhost/guest,
# mas em Docker/Kubernetes/AWS os valores podem vir por variáveis de ambiente.
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Exchange central que recebe as mensagens do fluxo de pedidos.
commerce.rabbitmq.exchange=commerce.pedidos.exchange

# Fila onde o serviço estoque irá consumir pedidos recém-solicitados.
commerce.rabbitmq.queue.pedido-solicitado=commerce.pedido.solicitado.queue

# Fila onde o serviço pedido irá consumir a resposta enviada pelo estoque.
commerce.rabbitmq.queue.estoque-resposta=commerce.estoque.resposta.queue

# Routing key usada para entregar mensagens de pedido solicitado na fila correta.
commerce.rabbitmq.routing-key.pedido-solicitado=pedido.solicitado

# Routing key usada para entregar respostas do estoque na fila correta.
commerce.rabbitmq.routing-key.estoque-resposta=estoque.resposta



# Topic exchange usada somente para eventos de auditoria.
# Diferente da DirectExchange, ela permite usar padrões como pedido.# nos bindings.
commerce.rabbitmq.topic-exchange.auditoria=commerce.auditoria.topic.exchange

# Fila que recebe eventos de auditoria relacionados a pedidos.
commerce.rabbitmq.queue.auditoria-pedido=commerce.auditoria.pedido.queue

# Routing key do evento publicado quando um pedido fica sem resposta do estoque.
commerce.rabbitmq.routing-key.pedido-sem-resposta-estoque=pedido.sem-resposta-estoque

# Intervalo da auditoria: procura pedidos PROCESSANDO a cada 10 segundos.
commerce.auditoria.pedidos-sem-resposta.fixed-delay-ms=10000
commerce.auditoria.pedidos-sem-resposta.initial-delay-ms=10000

# Um pedido PROCESSANDO ha mais de 30 segundos passa a ser auditado.
commerce.auditoria.pedidos-sem-resposta.limite-segundos=30

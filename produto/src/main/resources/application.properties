spring.application.name=produto

server.port=8082

# Importa um arquivo .env opcional da pasta onde o serviço é executado.
# Em Docker/EC2, os mesmos nomes de variáveis podem ser enviados por --env-file.
spring.config.import=optional:file:.env[.properties]

# Conexão com banco por variáveis de ambiente. Não grave credenciais reais aqui.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-commerce
  template:
    metadata:
      labels:
        app: cloud-commerce
    spec:
      containers:
        - name: cloud-commerce
          image: 382597877252.dkr.ecr.sa-east-1.amazonaws.com/microservicoscommerce-cloud-commerce:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: cloud-commerce-config
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud-commerce-secret
                  key: API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10

<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pedidos - Cloud Store</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<header class="navbar">

    <div class="logo">
        ☁️ Cloud Store
    </div>

    <nav>

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/estoque}">
            Estoque
        </a>

        <a th:href="@{/pedidos}">
            Pedidos
        </a>

    </nav>

    <a th:href="@{/carrinho}"
       class="cart-button">

        🛒 Carrinho

    </a>

</header>


<main>

    <h1>
        Pedidos realizados
    </h1>


    <div class="orders">

        <div class="order-card"
             th:each="pedido : ${pedidos}">

            <div>

                <h3>

                    Pedido #

                    <span th:text="${pedido.id}">
                        000
                    </span>

                </h3>

                <p>

                    Data:

                    <span th:text="${#temporals.format(
                        pedido.data,
                        'dd/MM/yyyy'
                    )}">
                        00/00/0000
                    </span>

                </p>

            </div>


            <span class="status"
                  th:classappend="${pedido.status == 'FINALIZADO'}
                    ? ' finalizado'
                    : ' processando'"
                  th:text="${pedido.status}">

                STATUS

            </span>


            <strong>

                R$

                <span th:text="${#numbers.formatDecimal(
                    pedido.valorTotal,
                    1,
                    2
                )}">
                    0.00
                </span>

            </strong>

        </div>

    </div>

</main>


<script th:src="@{/js/app.js}"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pedidos - Cloud Commerce</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-primary border-3">
        <div class="container">
            <a class="navbar-brand fw-semibold"
               th:href="@{/}">
                Cloud Commerce
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarPrincipal"
                    aria-controls="navbarPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="navbarPrincipal"
                 class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/estoque}">
                            Produtos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           aria-current="page"
                           th:href="@{/pedidos}">
                            Pedidos
                        </a>
                    </li>
                </ul>

                <a class="btn btn-primary btn-sm"
                   th:href="@{/carrinho}">
                    Carrinho
                    <span id="cart-count"
                          class="badge text-bg-light ms-2">
                        0
                    </span>
                </a>
            </div>
        </div>
    </nav>
</header>

<main class="container py-5">
    <section class="page-header mb-4">
        <p class="section-eyebrow text-primary fw-semibold mb-2">
            Histórico de compras
        </p>

        <h1 class="display-6 fw-bold mb-2">
            Pedidos realizados
        </h1>

        <p class="text-secondary mb-0">
            Lista consultada diretamente no microserviço de pedidos.
        </p>
    </section>

    <section aria-label="Lista de pedidos">
        <div id="orders-list"
             class="vstack gap-3"
             aria-live="polite">
            <div class="empty">
                Carregando pedidos...
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/pedidos.js}"></script>

</body>

</html>
